[workspace]
resolver = "2"
members = ["crates/hv-core", "crates/hv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AlexRHaigh/Hockey-Vision"
rust-version = "1.77"

[workspace.dependencies]
hv-core = { path = "crates/hv-core" }
nalgebra = "0.33"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
